<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMC アクション管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Oswald:wght@400;600&display=swap');

  :root {
    --navy: #0a1628;
    --blue: #1a3a5c;
    --accent: #00a8e8;
    --gold: #c9a84c;
    --light: #e8f4fd;
    --white: #ffffff;
    --gray: #8899aa;
    --border: #2a4a6a;
    --danger: #e05252;
    --success: #4caf7d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, var(--blue), var(--navy));
    border-bottom: 2px solid var(--accent);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo { font-family: 'Oswald', sans-serif; font-size: 26px; color: var(--accent); letter-spacing: 4px; }
  .logo span { color: var(--gold); }
  .header-sub { font-size: 11px; color: var(--gray); letter-spacing: 2px; }

  .toolbar {
    background: var(--blue);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .nav-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--light);
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--accent); border-color: var(--accent); color: var(--white); }

  .search-box {
    background: var(--navy);
    border: 1px solid var(--border);
    color: var(--white);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    width: 200px;
    transition: border-color 0.2s;
  }
  .search-box:focus { outline: none; border-color: var(--accent); }

  .filter-select {
    background: var(--navy);
    border: 1px solid var(--border);
    color: var(--white);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
  }
  .filter-select option { background: var(--navy); }

  .count-badge {
    margin-left: auto;
    color: var(--gold);
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
  }
  .count-badge span { color: var(--gray); font-size: 13px; font-family: 'Noto Sans JP', sans-serif; }

  .table-wrap {
    padding: 20px 24px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    background: var(--blue);
    color: var(--gray);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 10px 12px;
    text-align: left;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--accent); }
  thead th.sorted { color: var(--accent); }

  tbody tr {
    border-bottom: 1px solid rgba(42,74,106,0.5);
    transition: background 0.15s;
  }
  tbody tr:hover { background: rgba(0,168,232,0.05); }
  tbody tr.editing { background: rgba(0,168,232,0.1); }

  tbody td {
    padding: 8px 12px;
    color: var(--light);
    vertical-align: middle;
  }

  .td-name {
    font-weight: 500;
    color: var(--white);
    white-space: nowrap;
    min-width: 100px;
  }

  .badge-cat { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; white-space:nowrap; }
  .cat-send    { background:rgba(0,168,232,0.2); color:#00a8e8; border:1px solid rgba(0,168,232,0.4); }
  .cat-payment { background:rgba(76,175,125,0.2); color:#4caf7d; border:1px solid rgba(76,175,125,0.4); }
  .cat-change  { background:rgba(201,168,76,0.2); color:#c9a84c; border:1px solid rgba(201,168,76,0.4); }

  /* インライン編集 */
  .inline-input {
    background: var(--navy);
    border: 1px solid var(--accent);
    color: var(--white);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    width: 100%;
  }
  .inline-input:focus { outline: none; }
  .inline-select {
    background: var(--navy);
    border: 1px solid var(--accent);
    color: var(--white);
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
  }
  .inline-select option { background: var(--navy); }

  .btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 15px;
    padding: 2px 5px;
    border-radius: 3px;
    transition: background 0.15s;
    line-height: 1;
  }
  .btn-edit  { color: var(--accent); }
  .btn-save  { color: var(--success); }
  .btn-cancel{ color: var(--gray); }
  .btn-del   { color: var(--danger); }
  .btn-icon:hover { background: rgba(255,255,255,0.1); }

  .amount-pos { color: var(--success); }
  .amount-neg { color: var(--danger); }

  .loading {
    text-align: center;
    padding: 60px;
    color: var(--gray);
    font-size: 15px;
  }

  /* 新規追加フォーム */
  .add-row td { background: rgba(0,168,232,0.08); border-top: 2px solid var(--accent); }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 24px; border-radius: 6px;
    font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 999;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: var(--success); color: white; }
  .toast.error   { background: var(--danger);  color: white; }
  body.viewer-mode .editor-only { display: none !important; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">KM<span>C</span></div>
    <div class="header-sub">KANAZAWA HAKKEI MARINE CLUB</div>
  </div>
  <div style="margin-left:16px; color:var(--light); font-size:14px;">アクション管理</div>
  <button onclick="location.href='kmc_login.html'" style="margin-left:auto;background:rgba(224,82,82,0.15);border:1px solid rgba(224,82,82,0.45);color:#ff9999;padding:8px 20px;border-radius:6px;font-size:13px;font-family:'Noto Sans JP',sans-serif;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all 0.2s;" onmouseover="this.style.background='rgba(224,82,82,0.35)';this.style.color='#fff'" onmouseout="this.style.background='rgba(224,82,82,0.15)';this.style.color='#ff9999'">✕ 閉じる</button>
</header>

<div class="toolbar">
  <button class="nav-btn" onclick="location.href='kmc_list.html'" style="border-color:var(--accent);color:var(--accent);">📋 会員一覧</button>
  <button class="nav-btn editor-only" onclick="showAddRow()">＋ 追加</button>
  <input class="search-box" id="searchInput" type="text" placeholder="氏名で検索..." oninput="applyFilter()">
  <select class="filter-select" id="catFilter" onchange="applyFilter()">
    <option value="">カテゴリ（全て）</option>
    <option value="送付">送付</option>
    <option value="入出金">入出金</option>
    <option value="変更">変更</option>
  </select>
  <select class="filter-select" id="subFilter" onchange="applyFilter()">
    <option value="">サブカテゴリ（全て）</option>
    <option value="議事録">議事録</option>
    <option value="未納催促文">未納催促文</option>
  </select>
  <div class="count-badge" id="countBadge"><span>読込中...</span></div>
</div>

<div class="table-wrap">
  <table id="mainTable">
    <thead>
      <tr>
        <th onclick="sortBy('name')">氏名</th>
        <th onclick="sortBy('action_date')">日付</th>
        <th onclick="sortBy('category')">カテゴリ</th>
        <th onclick="sortBy('sub_category')">サブカテゴリ</th>
        <th onclick="sortBy('amount')" style="text-align:right;">金額</th>
        <th>メモ</th>
        <th class="editor-only" style="width:90px;"></th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="7" class="loading">データを読み込んでいます...</td></tr>
    </tbody>
  </table>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://wxuqqkpgyfkpuejvvzix.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8NnuA53dbxq_sK-yovy-wA_ZDvu2AHO';

let allRows = [];      // { action + name }
let filtered = [];
let sortKey = 'action_date';
let sortAsc = false;
let customerMap = {}; // id -> name

// ===== 権限 (role) =====
const kmcRole = localStorage.getItem('kmc_role');
if (kmcRole !== 'editor') { document.body.classList.add('viewer-mode'); }

async function api(method, path, body) {
  const res = await fetch(SUPABASE_URL + path, {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadAll() {
  try {
    const [customers, actions] = await Promise.all([
      api('GET', '/rest/v1/customers?select=id,name&order=id.asc'),
      api('GET', '/rest/v1/actions?select=*&order=action_date.desc,id.desc')
    ]);
    customerMap = {};
    customers.forEach(c => { customerMap[c.id] = c.name || '—'; });
    allRows = actions.map(a => ({ ...a, name: customerMap[a.customer_id] || '（不明）' }));
    applyFilter();
  } catch(e) {
    showToast('読込エラー: ' + e.message, 'error');
  }
}

function applyFilter() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const sub = document.getElementById('subFilter').value;
  filtered = allRows.filter(r => {
    if (q && !(r.name||'').toLowerCase().includes(q)) return false;
    if (cat && r.category !== cat) return false;
    if (sub && r.sub_category !== sub) return false;
    return true;
  });
  filtered.sort((a, b) => {
    let va = a[sortKey] ?? '';
    let vb = b[sortKey] ?? '';
    if (sortKey === 'amount') { va = Number(va)||0; vb = Number(vb)||0; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ?  1 : -1;
    return 0;
  });
  render();
}

function sortBy(key) {
  if (sortKey === key) { sortAsc = !sortAsc; } else { sortKey = key; sortAsc = true; }
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  applyFilter();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function catClass(cat) {
  if (cat === '送付')   return 'cat-send';
  if (cat === '入出金') return 'cat-payment';
  if (cat === '変更')   return 'cat-change';
  return '';
}
function fmtAmount(n) {
  if (n === null || n === undefined || n === '') return '—';
  const num = Number(n);
  if (isNaN(num) || num === 0) return '—';
  const cls = num > 0 ? 'amount-pos' : 'amount-neg';
  return `<span class="${cls}">${num > 0 ? '+' : ''}${num.toLocaleString()}円</span>`;
}

function render() {
  const tbody = document.getElementById('tableBody');
  document.getElementById('countBadge').innerHTML =
    filtered.length + ' <span>件</span>';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="loading">該当するアクションがありません</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(r => `
    <tr id="row-${r.id}" data-id="${r.id}">
      <td class="td-name">${esc(r.name)}</td>
      <td>${esc(r.action_date ? r.action_date.slice(0,10) : '—')}</td>
      <td><span class="badge-cat ${catClass(r.category)}">${esc(r.category||'—')}</span></td>
      <td>${esc(r.sub_category||'—')}</td>
      <td style="text-align:right;">${fmtAmount(r.amount)}</td>
      <td>${esc(r.memo||'')}</td>
      <td class="editor-only" style="white-space:nowrap;">
        <button class="btn-icon btn-edit"   onclick="startEdit(${r.id})" title="編集">✏️</button>
        <button class="btn-icon btn-del"    onclick="deleteRow(${r.id})" title="削除">🗑</button>
      </td>
    </tr>
  `).join('');
}

function startEdit(id) {
  if (localStorage.getItem('kmc_role') !== 'editor') { showToast('編集権限がありません', 'error'); return; }
  const r = allRows.find(x => x.id === id);
  if (!r) return;
  const tr = document.getElementById('row-' + id);
  tr.classList.add('editing');
  const today = new Date().toISOString().slice(0,10);
  tr.innerHTML = `
    <td class="td-name">${esc(r.name)}</td>
    <td><input class="inline-input" id="e_date" type="date" value="${r.action_date ? r.action_date.slice(0,10) : today}" style="width:130px;"></td>
    <td>
      <select class="inline-select" id="e_cat">
        <option value="送付"   ${r.category==='送付'   ?'selected':''}>送付</option>
        <option value="入出金" ${r.category==='入出金' ?'selected':''}>入出金</option>
        <option value="変更"   ${r.category==='変更'   ?'selected':''}>変更</option>
      </select>
    </td>
    <td>
      <select class="inline-select" id="e_sub">
        <option value="">—</option>
        <option value="議事録"    ${r.sub_category==='議事録'    ?'selected':''}>議事録</option>
        <option value="未納催促文" ${r.sub_category==='未納催促文'?'selected':''}>未納催促文</option>
      </select>
    </td>
    <td style="text-align:right;">
      <input class="inline-input" id="e_amount" type="number" value="${r.amount ?? ''}" placeholder="0" style="width:100px;text-align:right;">
    </td>
    <td><input class="inline-input" id="e_memo" type="text" value="${esc(r.memo||'')}" placeholder="メモ" style="width:160px;"></td>
    <td style="white-space:nowrap;">
      <button class="btn-icon btn-save"   onclick="saveEdit(${id})" title="保存">💾</button>
      <button class="btn-icon btn-cancel" onclick="cancelEdit(${id})" title="キャンセル">✕</button>
    </td>
  `;
}

async function saveEdit(id) {
  if (localStorage.getItem('kmc_role') !== 'editor') { showToast('編集権限がありません', 'error'); return; }
  const body = {
    action_date:  document.getElementById('e_date').value   || null,
    category:     document.getElementById('e_cat').value    || null,
    sub_category: document.getElementById('e_sub').value    || null,
    amount:       document.getElementById('e_amount').value !== '' ? Number(document.getElementById('e_amount').value) : null,
    memo:         document.getElementById('e_memo').value   || null,
  };
  try {
    const result = await api('PATCH', '/rest/v1/actions?id=eq.' + id, body);
    const updated = result && result[0] ? result[0] : { ...allRows.find(x=>x.id===id), ...body };
    const idx = allRows.findIndex(x => x.id === id);
    if (idx >= 0) allRows[idx] = { ...allRows[idx], ...updated };
    showToast('保存しました', 'success');
    applyFilter();
  } catch(e) {
    showToast('保存エラー: ' + e.message, 'error');
  }
}

function cancelEdit(id) {
  applyFilter();
}

async function deleteRow(id) {
  if (localStorage.getItem('kmc_role') !== 'editor') { showToast('削除権限がありません', 'error'); return; }
  if (!confirm('このアクションを削除しますか？')) return;
  try {
    await api('DELETE', '/rest/v1/actions?id=eq.' + id, null);
    allRows = allRows.filter(x => x.id !== id);
    showToast('削除しました', 'success');
    applyFilter();
  } catch(e) {
    showToast('削除エラー: ' + e.message, 'error');
  }
}

// 新規追加行
function showAddRow() {
  if (localStorage.getItem('kmc_role') !== 'editor') { showToast('編集権限がありません', 'error'); return; }
  const existing = document.getElementById('add-row');
  if (existing) { existing.remove(); return; }
  const today = new Date().toISOString().slice(0,10);
  const custOptions = Object.entries(customerMap)
    .map(([id, name]) => `<option value="${id}">${esc(name)}</option>`)
    .join('');
  const tbody = document.getElementById('tableBody');
  const tr = document.createElement('tr');
  tr.id = 'add-row';
  tr.className = 'add-row';
  tr.innerHTML = `
    <td>
      <select class="inline-select" id="a_cust" style="width:120px;">
        <option value="">— 会員選択 —</option>
        ${custOptions}
      </select>
    </td>
    <td><input class="inline-input" id="a_date" type="date" value="${today}" style="width:130px;"></td>
    <td>
      <select class="inline-select" id="a_cat">
        <option value="送付">送付</option>
        <option value="入出金">入出金</option>
        <option value="変更">変更</option>
      </select>
    </td>
    <td>
      <select class="inline-select" id="a_sub">
        <option value="">—</option>
        <option value="議事録">議事録</option>
        <option value="未納催促文">未納催促文</option>
      </select>
    </td>
    <td><input class="inline-input" id="a_amount" type="number" placeholder="0" style="width:100px;text-align:right;"></td>
    <td><input class="inline-input" id="a_memo" type="text" placeholder="メモ" style="width:160px;"></td>
    <td style="white-space:nowrap;">
      <button class="btn-icon btn-save"   onclick="saveAdd()" title="保存">💾</button>
      <button class="btn-icon btn-cancel" onclick="document.getElementById('add-row').remove()" title="キャンセル">✕</button>
    </td>
  `;
  tbody.insertBefore(tr, tbody.firstChild);
}

async function saveAdd() {
  if (localStorage.getItem('kmc_role') !== 'editor') { showToast('編集権限がありません', 'error'); return; }
  const custId = document.getElementById('a_cust').value;
  if (!custId) { showToast('会員を選択してください', 'error'); return; }
  const body = {
    customer_id:  Number(custId),
    action_date:  document.getElementById('a_date').value    || null,
    category:     document.getElementById('a_cat').value     || null,
    sub_category: document.getElementById('a_sub').value     || null,
    amount:       document.getElementById('a_amount').value !== '' ? Number(document.getElementById('a_amount').value) : null,
    memo:         document.getElementById('a_memo').value    || null,
  };
  try {
    const result = await api('POST', '/rest/v1/actions', body);
    if (result && result[0]) {
      allRows.unshift({ ...result[0], name: customerMap[result[0].customer_id] || '—' });
    }
    document.getElementById('add-row').remove();
    showToast('追加しました', 'success');
    applyFilter();
  } catch(e) {
    showToast('追加エラー: ' + e.message, 'error');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.className = 'toast', 3000);
}

loadAll();
</script>
</body>
</html>
