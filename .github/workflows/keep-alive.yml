name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping KMC
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL_KMC }}/rest/v1/?apikey=${{ secrets.SUPABASE_ANON_KEY_KMC }}")
          echo "KMC Response: $RESPONSE"
          [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 400 ] && echo "✅ KMC is alive!" || exit 1
